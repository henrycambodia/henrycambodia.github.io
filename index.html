<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Henry's Website!</title>
    <style>
        body {
            background-color: #161616;
            background-position: center top;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: scroll;
            color: #ffffff;
            margin: 40px auto;
            max-width: 800px;
            vertical-align: middle;
            font-weight: bold;
        }

        p {
            background-color: aqua;
            padding: 10px;
        }
    </style>
</head>




<script>
    class ImageLink extends HTMLElement {
        constructor(link, title, img) {
            super()
            this
            let shadow = this.attachShadow({ mode: "closed" });
        }
    }

    function website_load() {
        random_img = Math.floor(Math.random() * 5)
        if (random_img == 0) { // i can't find a match statement
            document.body.style.backgroundImage = 'url("FlintFactory.png")'
        } else if (random_img == 1) {
            document.body.style.backgroundImage = 'url("EnergyStation.png")'
        } else if (random_img == 2) {
            document.body.style.backgroundImage = 'url("TurretWall.png")'
        } else if (random_img == 3) {
            document.body.style.backgroundImage = 'url("ResourcesFactory.png")'
        } else if (random_img == 4) {
            document.body.style.backgroundImage = 'url("TunnelMakers.png")'
        }
    }

    async function search(text) {
        document.getElementById("SiteCointainer").innerHTML = ""

        const response = await fetch("./Links");
        const file_text = await response.text()
        links = file_text.split("\n")
        console.info("huh")
        for (let index = 0; (index * 3) < (links.length - 1); index++) {
            console.info("nice")
            if (links[index * 3].toLowerCase().includes(text.toLowerCase())) {
                heading = document.createElement("header");
                heading.className = "text";
                heading.textContent = links[index * 3];

                image = document.createElement("img");
                image.src = links[index * 3 + 1];
                image.className = "grow-on-hover";
                image.alt = links[index * 3];

                link = document.createElement("a");
                link.href = links[index * 3 + 2];

                link.appendChild(image);
                link.appendChild(heading)

                document.getElementById("SiteCointainer").appendChild(link)
            }
        }
    }


    function mousemove(event) {
        let x = 1;
        let y = 1;
        //x -= document.getElementById("Monkey").offsetLeft + (document.getElementById("Monkey").width) / 2
        //y -= document.getElementById("Monkey").offsetTop + document.getElementById("Monkey").height
        //document.getElementById("thingy").value = y * -1
        //document.getElementById("thingy2").value = x
        document.getElementById("ah").innerHTML =

            document.getElementById("Monkey").style.position.x = 500 - (100000 / (y * -1));

        document.getElementById("Monkey").style.position.y = 1000 - (y * -0.25);
        document.getElementById("Monkey").width = 100000 / (y * -1);
        document.getElementById("Monkey").height = y * -0.25;

    }
</script>



<body onload="website_load(); search('');">
    <img src=" Henrys-Explorer.png" style="padding: 0px 0px 200px 0px;">
    <marquee>I have 20 kids in my basement. This text will go away when the cops arive</marquee>
    <header id="temp"
        style="filter: drop-shadow(#FFFFFF 0px 0px 2px);-webkit-text-stroke: 0.1px black; font-size: large; color: white; text-shadow: 2px 2px 8px black;">
        Searchbar
    </header>


    <searchbar oninput="search(document.getElementById('SearchBar').value);">
        <input id="SearchBar" size="98px 60px"></input>
    </searchbar>

    <div class=" row_cointaner" id="SiteCointainer">

    </div>

    <style>
        .text {
            display: flex;
            word-wrap: break-word;
            max-width: 98px;
        }

        .row_cointaner {
            display: flex;
            flex-direction: row;
        }

        .grow-on-hover {
            transform-origin: bottom center;
            z-index: 0;
            flex: 0 0 80px;
            padding: 10px 5px;
            position: relative;
            margin: 20px 0px auto 0px;
            justify-content: center;
            align-items: center;
            display: flex;
            overflow: visible;
            transition: transform 100ms ease-out;
            width: 80px;
            height: 80px;
        }

        .grow-on-hover:hover {
            z-index: 1;
            transform: scale(1.3)
        }
    </style>

</body>

</html>
